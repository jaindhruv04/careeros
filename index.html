<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CareerOS | Dev Workspace</title>
    <style>
      body {
        margin: 0;
        background-color: #0b0d11;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      }
      .pre-mount-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        color: #f3f4f6;
        background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
        background-size: 24px 24px;
      }
      .pre-mount-card {
        position: relative;
        overflow: hidden;
        width: 320px;
        padding: 24px;
        border-radius: 16px;
        background: #13161c;
        border: 1px solid rgba(45, 212, 191, 0.3);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        text-align: center;
      }
      .pre-mount-laser {
        position: absolute;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(90deg, transparent, #2dd4bf, transparent);
        box-shadow: 0 0 16px #2dd4bf;
        animation: preLaser 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes preLaser {
        0% { top: 0%; opacity: 0; }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% { top: 100%; opacity: 0; }
      }
      .pre-mount-title {
        font-family: monospace;
        font-size: 14px;
        letter-spacing: 2px;
        color: #2dd4bf;
        margin-bottom: 6px;
      }
      .pre-mount-sub {
        font-size: 11px;
        color: #6b7280;
        font-family: monospace;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="pre-mount-loader">
        <div class="pre-mount-card">
          <div class="pre-mount-laser"></div>
          <div class="pre-mount-title">CAREEROS_KERNEL</div>
          <div class="pre-mount-sub">[INITIALIZING_WORKSPACE...]</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

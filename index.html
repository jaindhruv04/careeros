<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CareerOS | Dev Workspace</title>
    <style>
      body {
        margin: 0;
        background-color: #0b0d11;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      }
      .pre-mount-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
        color: #f3f4f6;
        background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
        background-size: 24px 24px;
      }
      .pre-mount-card {
        position: relative;
        overflow: hidden;
        width: 100%;
        max-width: 440px;
        padding: 24px;
        border-radius: 16px;
        background: #13161c;
        border: 1px solid rgba(45, 212, 191, 0.4);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.75);
      }
      .pre-mount-laser {
        position: absolute;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(90deg, transparent, #2dd4bf, transparent);
        box-shadow: 0 0 16px #2dd4bf, 0 0 32px rgba(45, 212, 191, 0.4);
        animation: preLaser 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        z-index: 10;
        pointer-events: none;
      }
      @keyframes preLaser {
        0% { top: 0%; opacity: 0; }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% { top: 100%; opacity: 0; }
      }
      .pre-mount-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
        padding-bottom: 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }
      .pre-mount-title {
        font-family: monospace;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 2px;
        color: #2dd4bf;
      }
      .pre-mount-status {
        font-size: 10px;
        font-family: monospace;
        color: #9ca3af;
        background: rgba(45, 212, 191, 0.1);
        border: 1px solid rgba(45, 212, 191, 0.2);
        padding: 2px 8px;
        border-radius: 9999px;
      }
      .skull-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 12px;
        margin-bottom: 16px;
        background: rgba(45, 212, 191, 0.03);
        border: 1px solid rgba(45, 212, 191, 0.2);
        border-radius: 12px;
      }
      .skull-svg {
        width: 110px;
        height: 130px;
        filter: drop-shadow(0 0 12px rgba(45, 212, 191, 0.5));
      }
      .skull-tag {
        font-family: monospace;
        font-size: 9px;
        letter-spacing: 1.5px;
        color: #2dd4bf;
        margin-top: 6px;
      }
      .skel-row {
        height: 28px;
        width: 100%;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.12);
        margin-bottom: 8px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="pre-mount-loader">
        <div class="pre-mount-card">
          <div class="pre-mount-laser"></div>
          
          <div class="pre-mount-header">
            <span class="pre-mount-title">CAREEROS_KERNEL</span>
            <span class="pre-mount-status">MRI_SCAN_ACTIVE</span>
          </div>

          <div class="skull-box">
            <svg viewBox="0 0 200 240" class="skull-svg" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M 60 90 C 50 50, 70 20, 100 20 C 130 20, 150 50, 140 90 C 145 105, 138 120, 135 125 C 130 135, 120 145, 120 155 L 80 155 C 80 145, 70 135, 65 125 C 62 120, 55 105, 60 90 Z" stroke="#2dd4bf" stroke-width="2.5" stroke-linecap="round"/>
              <ellipse cx="80" cy="85" rx="15" ry="18" stroke="#2dd4bf" stroke-width="2" fill="#0b0d11"/>
              <ellipse cx="120" cy="85" rx="15" ry="18" stroke="#2dd4bf" stroke-width="2" fill="#0b0d11"/>
              <circle cx="80" cy="85" r="4" fill="#2dd4bf"/>
              <circle cx="120" cy="85" r="4" fill="#2dd4bf"/>
              <path d="M 100 96 L 93 116 L 107 116 Z" stroke="#2dd4bf" stroke-width="1.8" fill="#0b0d11"/>
              <path d="M 58 95 L 68 112 L 80 118" stroke="#2dd4bf" stroke-width="1.8"/>
              <path d="M 142 95 L 132 112 L 120 118" stroke="#2dd4bf" stroke-width="1.8"/>
              <rect x="85" y="132" width="30" height="18" rx="3" stroke="#2dd4bf" stroke-width="1.8"/>
              <line x1="100" y1="132" x2="100" y2="150" stroke="#2dd4bf" stroke-width="1.2"/>
              <line x1="92" y1="132" x2="92" y2="150" stroke="#2dd4bf" stroke-width="1.2"/>
              <line x1="108" y1="132" x2="108" y2="150" stroke="#2dd4bf" stroke-width="1.2"/>
              <path d="M 75 145 L 82 170 L 118 170 L 125 145" stroke="#2dd4bf" stroke-width="2.2"/>
              <rect x="94" y="176" width="12" height="6" rx="2" stroke="#2dd4bf" stroke-width="1.6" fill="#13161c"/>
              <rect x="92" y="186" width="16" height="6" rx="2" stroke="#2dd4bf" stroke-width="1.6" fill="#13161c"/>
              <path d="M 38 206 Q 70 194 90 205" stroke="#2dd4bf" stroke-width="2.2"/>
              <path d="M 162 206 Q 130 194 110 205" stroke="#2dd4bf" stroke-width="2.2"/>
              <path d="M 44 220 Q 70 210 90 215" stroke="#2dd4bf" stroke-width="1.8"/>
              <path d="M 156 220 Q 130 210 110 215" stroke="#2dd4bf" stroke-width="1.8"/>
            </svg>
            <div class="skull-tag">[X-RAY BONE SCAN ACTIVE]</div>
          </div>

          <div class="skel-row"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

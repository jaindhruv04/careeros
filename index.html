<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CareerOS | Dev Workspace</title>
    <style>
      body {
        margin: 0;
        background-color: #0b0d11;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      }
      .pre-mount-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
        color: #f3f4f6;
        background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
        background-size: 24px 24px;
      }
      .pre-mount-card {
        position: relative;
        overflow: hidden;
        width: 100%;
        max-width: 480px;
        padding: 24px;
        border-radius: 16px;
        background: #13161c;
        border: 1px solid rgba(45, 212, 191, 0.3);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
      }
      .pre-mount-laser {
        position: absolute;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(90deg, transparent, #2dd4bf, transparent);
        box-shadow: 0 0 16px #2dd4bf, 0 0 32px rgba(45, 212, 191, 0.4);
        animation: preLaser 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        z-index: 10;
        pointer-events: none;
      }
      @keyframes preLaser {
        0% { top: 0%; opacity: 0; }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% { top: 100%; opacity: 0; }
      }
      .pre-mount-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        padding-bottom: 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }
      .pre-mount-title {
        font-family: monospace;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 2px;
        color: #2dd4bf;
      }
      .pre-mount-status {
        font-size: 10px;
        font-family: monospace;
        color: #9ca3af;
        background: rgba(45, 212, 191, 0.1);
        border: 1px solid rgba(45, 212, 191, 0.2);
        padding: 2px 8px;
        border-radius: 9999px;
      }
      /* Vivid Skeleton Elements */
      .skel-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 16px;
      }
      .skel-box {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 10px;
        padding: 14px;
        animation: skelPulse 1.8s ease-in-out infinite;
      }
      .skel-line {
        height: 10px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.14);
        margin-bottom: 8px;
      }
      .skel-val {
        height: 22px;
        width: 60%;
        border-radius: 6px;
        background: rgba(45, 212, 191, 0.2);
        border: 1px solid rgba(45, 212, 191, 0.3);
      }
      .skel-row {
        height: 38px;
        width: 100%;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
        margin-bottom: 8px;
        animation: skelPulse 1.8s ease-in-out infinite;
      }
      @keyframes skelPulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="pre-mount-loader">
        <div class="pre-mount-card">
          <div class="pre-mount-laser"></div>
          
          <div class="pre-mount-header">
            <span class="pre-mount-title">CAREEROS_KERNEL</span>
            <span class="pre-mount-status">WAKING_UP_INSTANCE</span>
          </div>

          <div class="skel-grid">
            <div class="skel-box">
              <div class="skel-line" style="width: 50%;"></div>
              <div class="skel-val"></div>
            </div>
            <div class="skel-box">
              <div class="skel-line" style="width: 65%;"></div>
              <div class="skel-val"></div>
            </div>
          </div>

          <div class="skel-row"></div>
          <div class="skel-row" style="opacity: 0.5;"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
